<!DOCTYPE html>

<head>

    <title>HJ's Gallery</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="gallery.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <nav id="catalogue">

                <li><a href="#travel">Travel</a></li>

                    <figure>

                    <figure>
                        <div class="img-wrapper">
                            <img src="img/pavillionNLS.jpeg" alt="">

                    <figure>

                    <figure>
                        <div class="img-wrapper">

                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/toiletpaper.jpeg" alt="">

                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/tokyotowertop.jpeg" alt="">

                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/kabukicho.jpeg" alt="">
                        </div>
                        <figcaption></figcaption>
                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/ikebe.jpeg" alt="">
                        </div>
                        <figcaption>Endless selection of drumsticks</figcaption>
                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/sgview.jpeg" alt="">
                        </div>
                        <figcaption>Top bar view of SG~</figcaption>
                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/towerbridge.jpeg" alt="">
                        </div>
                        <figcaption></figcaption>
                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/londonclock.jpeg" alt="">
                        </div>
                        <figcaption></figcaption>
                    </figure>
            </section>

            <section id="job" class="gallery-section">
                <h2>Jobs</h2>
                <div class="grid-container">
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/psrLogistics.jpeg" alt="PSR Rehearsals">
                        </div>
                        <figcaption>Rehearsals for PSR — handling both operations and logistics</figcaption>
                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/copybook.jpeg" alt="">
                        </div>
                        <figcaption>Teaching children kind of reminds me of my mum teaching me in Primary School</figcaption>
                    </figure>
                </div>
            </section>

            <section id="achievement" class="gallery-section">
                <h2>Little Proud Moments</h2>
                <div class="grid-container">
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/jlpt.jpeg" alt="JLPT Certificate">
                        </div>
                        <figcaption>Still can't believe I obtained full marks on the official Japanese Language Test</figcaption>
                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/menupage.png" alt="" srcset="">
                        </div>
                        <figcaption>Movie web app I created with my team</figcaption>
                    </figure>
                    <figure>
                        <div class="img-wrapper">
                            <img src="img/moviepage.png" alt="" srcset="">
                        </div>
                        <figcaption>It works!</figcaption>
                    </figure>
                </div>
            </section>

            <section id="experiment" class="gallery-section">
                <h2>Experiments</h2>
                <div>
                    Some (interesting) music I created: <br>
                    <audio src="audio/null.mp3" controls></audio>
                    <audio src="audio/Sunny Car Ride On Mountain (alpha 1.2).mp3" controls></audio>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <p>WONG HIN JI &bull; 2026</p>
    </footer>
</body>
</html>
